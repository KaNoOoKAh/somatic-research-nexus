observations:

  - timestamp: "06:17"
    observation: >
      Initiated contraction/tension cycle from the feet to the head.

  - timestamp: "06:19"
    observation: >
      Continued contraction at the foot level without moving.
      The force felt super light.
      The air felt cool around the feet.

  - timestamp: "06:21"
    observation: >
      Relaxed state.
      The pulse or force felt like it was thinning out and
      covering more skin areas now.
      It no longer felt heavy at the bottoms of the feet.

  - timestamp: "06:24-06:25"
    observation: >
      Soft inhalation initiated.
      Major shift in cranial and nasal pressure.
      Air felt like it entered the left side only unless
      concentration and effort were applied to include the right side.

  - timestamp: "06:31-06:32"
    observation: >
      Strange response below the nose inside the face.
      Pulsating sensation felt in the front of the throat.

  - timestamp: "06:34"
    observation: >
      Saliva produced in the rear of the mouth and throat
      tasted sweet.

  - timestamp: "06:35"
    observation: >
      Brief auditory tone appeared in the right ear and
      quickly disappeared.

  - timestamp: "06:36"
    observation: >
      Body lying down flat on futon.
      Back flat.
      Pelvis near wall.
      Knees bent above pelvis and angled outward/upward.
      Shins angled inward at different angles.
      Plugged feeling present above the right side of the lip
      but below the nostril.

  - timestamp: "06:41"
    observation: >
      Tracking paused to document elongated hard growth
      observed on cat.

raw_subjective_context:

  proprioception:
    observation: >
      When eyes were closed and/or attention was not directed
      toward the legs, the legs felt straight and flat-footed.

  feet_force:
    observation: >
      Force felt across the entire area of the bottoms
      of the feet.
      Force felt evenly distributed despite body position.

  vibration:
    observation: >
      Force described as pulse, vibration, radiation,
      electrical buzz, or current-like sensation.

  shin_knee_region:
    observation: >
      Sensation present in fronts of shins and knees.

  contraction_method:
    observation: >
      Applied same contraction/control pattern previously used
      while wearing dress shoes at grandmother's celebration of life.
      Pattern involved stabilizing feet, maintaining flat-foot
      structure, and applying pulling/contraction through feet
      and area below knees.

  relaxation_response:
    observation: >
      When contraction was released,
      force became more full and dull at the bottoms of the feet.

  hip_response:
    observation: >
      Moving phone from left side of body to center of chest
      coincided with unusual movement sensation in hip.
      No pain.
      Felt as if bone pushed against muscle or tissue.

  left_hip_activity:
    observation: >
      During contraction cycles,
      left hip/joint region repeatedly produced involuntary movement.
      Movement felt side-to-side but did not feel like the purpose
      of the movement.
      Felt as though up/down directional activity was producing
      movement near that area.

